name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Pillow (launcher icons)
        run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow

      - name: Prepare Android project
        working-directory: app
        run: |
          flutter --version
          # ننشئ هيكل أندرويد في مجلد مؤقت ثم ننسخه، فلا يمس ملفات التطبيق (lib / pubspec).
          flutter create --platforms=android --org app.alfaham --project-name tv --no-pub "$RUNNER_TEMP/scaffold"
          rm -rf android
          cp -r "$RUNNER_TEMP/scaffold/android" android
          python3 tool/patch_android.py android
          # مفتاح توقيع ثابت: يسمح بتحديث التطبيق فوق النسخة القديمة دون حذفها.
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - name: Install packages
        working-directory: app
        run: flutter pub get

      - name: Run tests
        working-directory: app
        continue-on-error: true
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Verify APK signature (fails the build if the file is not installable)
        run: |
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      - name: Show minimum Android version
        continue-on-error: true
        run: |
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code"

      - name: Collect file
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/AlfahamTV.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: AlfahamTV-apk
          path: dist/*.apk

      - name: Publish to Releases (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Alfaham TV (latest APK)
          body: |
            أحدث نسخة من تطبيق أندرويد. حمّل ملف `AlfahamTV.apk` فقط وثبّته (يعمل على الهواتف 32 و64 بت).
          files: dist/*.apk
