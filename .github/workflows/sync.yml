name: Sync channels
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'تجربة فقط بدون كتابة'
        type: boolean
        default: false
      only:
        description: 'دول محددة مثل SA,EG (اختياري)'
        required: false
permissions:
  contents: read
concurrency:
  group: sync-channels
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix bot --no-audit --no-fund
      - name: Self-test
        run: npm test --prefix bot
      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
          ONLY: ${{ inputs.only }}
        run: |
          ARGS=""
          if [ "$DRY" = "true" ]; then ARGS="--dry"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only=$ONLY"; fi
          node bot/sync.mjs $ARGS
