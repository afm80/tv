<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family: 'Cairo', sans-serif;
    background: url('https://h.top4top.io/p_3784nirj21.png') center / cover no-repeat fixed;
    min-height: 100vh;

}

.site-header {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 100000;
    height: 64px;

    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);

    text-overflow: ellipsis;
}

.sidebar-toggle,
.nav-item,
.sidebar-close,
.search-toggle {

    color: #fff;
    cursor: pointer;
    font-family: inherit;
}

.sidebar-toggle {

    height: 42px;

    align-items: center;
    justify-content: center;
}

.search-toggle {

    width: 42px;
    height: 42px;

    align-items: center;

.header-actions {

    font-size: 13px;

.install-app-button i { flex: 0 0 auto; }
.install-app-button span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

}

}

.card.message-card {

}

.hidden {

}

.sidebar-overlay.hidden {

}

.sidebar {

}

.sidebar-open .sidebar {

}

.sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.sidebar-title {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
}

.sidebar-close {
    border: none;
    background: transparent;
    color: #fff;
    font-size: 26px;

    line-height: 1;
}

.sidebar-open .sidebar-overlay {

}

.sidebar-brand {

    flex-direction: column;
    align-items: center;
    border-bottom: 0;
}

.sidebar-logo {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-name {
    font-size: 18px;
    font-weight: 800;
    margin-top: 15px;
    color: #ffffff;
}

.sidebar-section {
    padding: 0 20px 20px;
}

.sidebar-section-title {
    font-size: 12px;
    text-transform: uppercase;
    color: var(--text-muted);

}

.sidebar-link {

    min-width: 0;
    gap: 8px;
    padding: 10px 8px;
    color: #ffffff;

}

.sidebar-link i {

    align-items: center;
    justify-content: center;
}

.sidebar-link-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sidebar-link:hover,
.sidebar-link:active {
    background: rgba(255, 102, 0, 0.15);
    color: #FF6600;
}

.sidebar-link:hover i,
.sidebar-link:active i {

}

.search-modal {
    position: fixed;
    inset: 0;
    z-index: 1000002;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 88px 16px 24px;

}
.search-modal.hidden { display:none; }
.search-box { width:min(620px,100%); background:#171717; border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:16px; box-shadow:0 20px 70px rgba(0,0,0,.5); }

.search-input:focus { outline:2px solid rgba(255,140,0,.7); outline-offset:1px; border-color:#ff8c00; }
.search-clear { position:absolute; top:50%; right:10px; transform:translateY(-50%); display:none; border:0; background:transparent; color:rgba(255,255,255,.65); font-size:20px; line-height:1; cursor:pointer; padding:4px; }
.search-clear.visible { display:block; }
.search-clear:hover { color:#fff; }

.search-results { max-height:60vh; overflow:auto; margin-top:12px; }
.search-result { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; border:0; border-bottom:1px solid rgba(255,255,255,.08); background:transparent; color:#fff; text-align:right; padding:12px 4px; cursor:pointer; font:inherit; }
.search-result:hover, .search-result:focus-visible { color:#ff8c00; background:rgba(255,140,0,.08); outline:none; }

.bottom-nav {
    position: fixed;
    inset: auto 0 0 0;
    z-index: 100000;
    display: flex;
    justify-content: center;
    align-items: stretch;
    height: 64px;

}

.nav-item {
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

}

.nav-item:hover {

}

.nav-icon {
    font-size: 18px;

}

.content-container {
    width: min(100%, 1400px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 94px 16px 100px;
    margin: 0 auto;
    overflow-y: auto;
}

.player-open .site-header,
.player-open .bottom-nav,
.player-open .sidebar,
.player-open .sidebar-overlay,
.player-open .content-container {

}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 110px);
    gap: 8px;
    justify-content: center;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
}

.card {
    background-color: rgba(255, 255, 255, 0.92);

}

.card-title {

}

.player-container {
    position: fixed;
    top: 0;
    left: 0;

.matches-table-container,

.external-link-toolbar {

.external-link-title {

.close-embed-btn {

#player-wrapper {

.video-js,

.playerjs-container iframe,

.playerjs-container.hidden,
.video-js.hidden,
#clappr-container.hidden,
#dplayer-container.hidden,

#shaka-video.hidden,
#dashjs-video.hidden,
#plyr-video.hidden,
#mediaelement-video.hidden,
#jwplayer-container.hidden,
#flowplayer-container.hidden {

}

.matches-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 14px;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

@media (min-width: 769px) {
    .matches-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 768px) {
    .content-container {
        padding: 84px 12px 100px;
    }

    }

    .sidebar {

.match-card {

    border-radius: 12px;

(function(window) {
    class Playerjs {
        constructor(config) {
            if (!config || !config.id || !config.file) return;
            this.container = document.getElementById(config.id);
            this.events = {};
            this.hls = null;
            this.video = document.createElement('video');
            this.video.controls = true;
            this.video.playsInline = true;
            this.video.autoplay = !!config.autoplay;
            this.video.crossOrigin = 'anonymous';
            this.video.style.width = '100%';
            this.video.style.height = '100%';
            this.video.style.borderRadius = '12px';
            this.video.style.backgroundColor = '#000';
            if (this.container) {
                this.container.innerHTML = '';
                this.container.appendChild(this.video);
            }
            this.url = config.file;
            if (this.url && this.url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
                this.hls = new Hls();
                this.hls.loadSource(this.url);
                this.hls.attachMedia(this.video);
                this.hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        this.emit('error', data);
                    }
                });
            } else if (this.url) {
                this.video.src = this.url;
            }
            this.video.addEventListener('error', () => {
                this.emit('error', { message: 'Video element error', code: this.video.error ? this.video.error.code : null });
            });
            if (this.video.autoplay) {
                this.video.play().catch(() => {});
            }
        }

        on(event, callback) {
            if (!this.events[event]) this.events[event] = [];
            this.events[event].push(callback);
        }

        emit(event, data) {
            if (!this.events[event]) return;
            this.events[event].forEach((callback) => {
                try {
                    callback(data);
                } catch (err) {
                    console.error('Playerjs event callback error:', err);
                }
            });
        }

        pause() {
            if (this.video && typeof this.video.pause === 'function') {
                this.video.pause();
            }
        }

        destroy() {
            if (this.hls && typeof this.hls.destroy === 'function') {
                this.hls.destroy();
                this.hls = null;
            }
            if (this.video) {
                try {
                    this.video.pause();
                } catch (err) {}
                if (this.video.parentNode) {
                    this.video.parentNode.removeChild(this.video);
                }
                this.video = null;
            }
            if (this.container) {
                this.container.innerHTML = '';
                this.container = null;
            }
            this.events = {};
        }
    }

    window.Playerjs = Playerjs;
})(window);

    if (sourceToken !== playerSourceToken) return false;

    for (let engine of getFallbackOrder(url)) {
        if (!attemptedFallbacks[engine]) {
            setPlayerSource(url, engine, false);
            const sourceToken = playerSourceToken;
            engineTimeoutHandle = setTimeout(() => {
                if (sourceToken === playerSourceToken && !parallelEngineSuccessful) {
                    fallbackToNextEngine(url, sourceToken);
                }
            }, 5000);
            return true;
        }
    }
    
    const engineSelect = $('playerEngineSelect');
    if (engineSelect) engineSelect.value = 'auto';
    return fallbackToNextLink();
}

function fallbackToNextLink() {
    if (!currentChannelLinks || currentChannelLinks.length <= 1) return false;
    const nextIndex = currentLinkIndex + 1;
    if (nextIndex >= currentChannelLinks.length) {
        showPlayerError('عذراً، جميع الروابط غير مدعومة');
        return false;
    }
    
    currentLinkIndex = nextIndex;
    currentQualityIndex = nextIndex;
    currentQualityMode = 'links';
    
    Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
    parallelEngineSuccessful = false;

}

function getSidebarIcon(link) {
    const storedIcon = String(link.icon || '').trim();
    if (/^(?:fab|fas|far|fa-brands|fa-solid|fa-regular)\s+fa-[\w-]+$/i.test(storedIcon)) return storedIcon;
    const icons = {
        youtube: 'fab fa-youtube', facebook: 'fab fa-facebook', instagram: 'fab fa-instagram',
        tiktok: 'fab fa-tiktok', x: 'fab fa-x-twitter', twitter: 'fab fa-x-twitter',
        whatsapp: 'fab fa-whatsapp', telegram: 'fab fa-telegram', snapchat: 'fab fa-snapchat',
        store: 'fas fa-store'
    };
    const platform = String(link.platform || '').toLowerCase();
    if (icons[platform]) return icons[platform];
    try {
        const hostname = new URL(link.url).hostname.toLowerCase().replace(/^www\./, '');
        const domain = Object.keys(icons).find(key => hostname === `${key}.com` || hostname.endsWith(`.${key}.com`));

        if (hostname.includes('store')) return icons.store;
    } catch (error) {}
    return 'fas fa-link';
}

function applyViewMode() {
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');

    if (window.currentViewMode !== 'externalLink' && $('externalLinkIframe')) {
        $('externalLinkIframe').removeAttribute('src');
    }
    
    if (currentChannelId) {
        $('playerContainer').classList.remove('hidden');
        document.body.classList.add('player-open');
    } else {
        $('playerContainer').classList.add('hidden');
        document.body.classList.remove('player-open');
    }

    if (window.currentViewMode === 'matches') {
        if ($('grid')) $('grid').classList.add('hidden');
        if ($('matchesGrid')) $('matchesGrid').classList.remove('hidden');
        if ($('matchesTableContainer')) $('matchesTableContainer').classList.add('hidden');
        if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
        if (matchesNav) matchesNav.classList.add('active');
        if (homeNav) homeNav.classList.remove('active');
    } else if (window.currentViewMode === 'matchesTable') {
        if ($('grid')) $('grid').classList.add('hidden');
        if ($('matchesGrid')) $('matchesGrid').classList.add('hidden');
        if ($('matchesTableContainer')) $('matchesTableContainer').classList.remove('hidden');
        if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
        if (matchesNav) matchesNav.classList.add('active');
        if (homeNav) homeNav.classList.remove('active');
    } else if (window.currentViewMode === 'externalLink') {
        openExternalPage(window.currentExternalUrl, true);
        return;
    } else {
        /* عرض الشبكة الرئيسية */
        if ($('grid')) $('grid').classList.remove('hidden');
        if ($('matchesGrid')) $('matchesGrid').classList.add('hidden');
        if ($('matchesTableContainer')) $('matchesTableContainer').classList.add('hidden');
        if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
        if (homeNav) homeNav.classList.add('active');
        if (matchesNav) matchesNav.classList.remove('active');
        /* نظّف الـ hash إذا كان يبدأ بـ ext: */
        if (window.location.hash.startsWith('#ext:')) {
            try {
                history.replaceState({
                    path: 'navigation',
                    stack: [...currentStack],
                    channelId: null,
                    viewMode: 'home',
                    externalUrl: ''
                }, '', window.location.pathname + window.location.search);
            } catch(e) {}
        }
    }
}

function serializeStack(stack) {
    return stack.filter(Boolean).join(',');
}

function buildHash(stack, channelId) {
    if (window.currentViewMode === 'matches') return 'matches';
    if (window.currentViewMode === 'matchesTable') return 'matchesTable';
    if (window.currentViewMode === 'externalLink' && window.currentExternalUrl) return `ext:${encodeURIComponent(window.currentExternalUrl)}`;
    const stackHash = serializeStack(stack);
    if (!stackHash && !channelId) return '';
    return channelId ? `${stackHash}|${channelId}` : stackHash;
}

function pushState() {
    const hash = buildHash(currentStack, currentChannelId);
    const url = `${window.location.pathname}${window.location.search}${hash ? `#${hash}` : ''}`;
    window.history.pushState({ 
        path: 'navigation', 
        stack: [...currentStack], 
        channelId: currentChannelId,
        viewMode: window.currentViewMode,
        externalUrl: window.currentExternalUrl 
    }, '', url);
}

function restoreHashState() {
    const raw = window.location.hash.slice(1);
    if (!raw) return { stack: [], channelId: null, viewMode: 'home', externalUrl: '' };
    if (raw === 'matches') return { stack: [], channelId: null, viewMode: 'matches', externalUrl: '' };
    if (raw === 'matchesTable') return { stack: [], channelId: null, viewMode: 'matchesTable', externalUrl: '' };
    if (raw.startsWith('ext:')) {
        try {
            const externalUrl = decodeURIComponent(raw.slice(4));
            const parsed = new URL(externalUrl, window.location.href);
            if (['http:', 'https:'].includes(parsed.protocol)) {
                return { stack: [], channelId: null, viewMode: 'externalLink', externalUrl: parsed.href };
            }
        } catch (error) {}
        return { stack: [], channelId: null, viewMode: 'home', externalUrl: '' };
    }
    const [stackPart, channelId] = raw.split('|');
    const ids = stackPart ? stackPart.split(',').filter(Boolean) : [];
    const validStack = [];
    ids.forEach((id, index) => {
        if (!categoriesCache[id]) return;
        if (index === 0 || categoriesCache[id].parentId === validStack[index - 1]) {
            validStack.push(id);
        }
    });
    return { stack: validStack, channelId: channelId || null, viewMode: 'home', externalUrl: '' };
}

function getDescendants(rootId) {
    const ids = [rootId];
    for (let i = 0; i < ids.length; i++) {
        Object.values(categoriesCache).forEach(c => {
            if (c.parentId === ids[i] && !ids.includes(c.id)) ids.push(c.id);
        });
    }
    return ids;
}

function getChannelCategoryIds(channel) {
    if (!channel) return [];
    let ids = [];
    if (channel.categoryIds) {
        ids = Array.isArray(channel.categoryIds) ? channel.categoryIds : Object.values(channel.categoryIds);
    } else if (channel.categories) {
        ids = Array.isArray(channel.categories) ? channel.categories : Object.values(channel.categories);
    } else if (channel.categoryId) {
        ids = [channel.categoryId];
    } else if (channel.catId) {
        ids = [channel.catId];
    }
    return ids.map(id => String(id)).filter(id => id && id !== 'undefined');
}

function parseChannelLinks(ch) {
    const links = [];
    if (ch.links && typeof ch.links === 'object') {
        Object.keys(ch.links).forEach(key => {
            const entry = ch.links[key];
            if (entry && entry.url) {
                links.push({ label: entry.label || key, url: entry.url });
            } else if (typeof entry === 'string') {
                links.push({ label: key, url: entry });
            }
        });
    }
    ['mainLink', 'hdLink', 'sdLink', 'backupLink', 'url', 'stream', 'src', 'play', 'link', 'video', 'm3u8', 'mp4'].forEach(prop => {
        if (ch[prop] && typeof ch[prop] === 'string' && !links.some(l => l.url === ch[prop])) {
            links.push({ label: prop, url: ch[prop] });
        }
    });
    if (ch.url && typeof ch.url === 'string' && !links.some(l => l.url === ch.url)) {
        links.push({ label: 'الرئيسي', url: ch.url });
    }
    const priority = ['الرئيسي', 'main', 'auto', 'Auto', 'AUTO'];
    links.sort((a, b) => {
        const aIndex = priority.findIndex(label => a.label.includes(label));
        const bIndex = priority.findIndex(label => b.label.includes(label));
        if (aIndex === -1 && bIndex === -1) return 0;
        if (aIndex === -1) return 1;
        if (bIndex === -1) return -1;
        return aIndex - bIndex;
    });
    return links;
}

function showPlayer(pushHistory = true) {

    document.body.classList.add('player-open');
    document.body.style.overflow = 'hidden';
    if (pushHistory) pushState();

function showQualityButtons() {
    updateQualityMenuVisibility();
}

function updateQualityMenuVisibility() {
    const toggle = $('qualityToggle');
    if (toggle) {
        toggle.style.display = qualityMenuAvailable ? 'flex' : 'none';
    }
}

function updateQualityMenu() {
    const list = $('qualityOptionList');
    if (!list) return;
    list.classList.add('hidden');
    if (!qualityMenuAvailable || currentQualityMode !== 'hls' || !currentQualitySources || currentQualitySources.length <= 1) {
        list.innerHTML = '';
        return;
    }
    list.innerHTML = '';
    currentQualitySources.forEach((source, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quality-option-item' + (idx === currentQualityIndex ? ' active' : '');
        btn.textContent = source.label || `الجودة ${idx + 1}`;
        btn.onclick = (e) => {
            e.stopPropagation();
            currentQualityIndex = idx;
            if (source.rep && typeof source.rep.enabled === 'function') {
                currentQualitySources.forEach((item, i) => {
                    if (item.rep && typeof item.rep.enabled === 'function') item.rep.enabled(i === idx);
                });
            } else if (source.hls && Number.isInteger(source.level)) {
                source.hls.currentLevel = source.level;
            }
            document.querySelectorAll('.quality-option-item').forEach((item, i) => item.classList.toggle('active', i === idx));
            closeQualityMenu();
        };
        list.appendChild(btn);
    });
}

function toggleQualityMenu(event) {
    if (event) event.stopPropagation();
    const list = $('qualityOptionList');
    if (list) list.classList.toggle('hidden');
}

function closeQualityMenu() {
    const list = $('qualityOptionList');
    if (list) list.classList.add('hidden');
}

document.addEventListener('click', closeQualityMenu);

function getHlsRepresentations(player) {
    const tech = player.tech({ IWillNotUseThisInPlugins: true });
    if (!tech || !tech.vhs) return [];
    if (typeof tech.vhs.representations === 'function') {
        return tech.vhs.representations().map(rep => ({
            label: getQualityLabel(rep),
            rep
        }));
    }
    const master = tech.vhs.playlists && tech.vhs.playlists.master;
    if (!master || !Array.isArray(master.playlists)) return [];
    return master.playlists.map((playlist, index) => ({
        label: getQualityLabel(playlist, index),
        playlist
    }));
}

function getQualityLabel(source, index = 0) {
    const attributes = source?.attributes || source?.attrs || source?.playlist?.attributes || {};
    const originalName = source?.name || attributes.NAME || attributes.name;
    if (originalName) return String(originalName);
    const resolution = source?.height ? `${source.height}p` : attributes.RESOLUTION?.height ? `${attributes.RESOLUTION.height}p` : '';
    if (resolution) return resolution;
    const bitrate = source?.bitrate || source?.bandwidth || attributes.BANDWIDTH;
    return bitrate ? `${Math.round(Number(bitrate) / 1000)}kbps` : `جودة ${index + 1}`;
}

function detectHlsQualities(player) {
    const reps = getHlsRepresentations(player);
    if (reps.length <= 1) {
        qualityMenuAvailable = false;
        updateQualityMenuVisibility();
        return;
    }
    currentQualityMode = 'hls';
    currentQualitySources = reps;
    currentQualityIndex = 0;
    qualityMenuAvailable = true;
    updateQualityMenu();
    showQualityButtons();
}

function detectHlsJsQualities(hls) {
    const levels = hls?.levels || [];
    if (levels.length <= 1) {
        qualityMenuAvailable = false;
        updateQualityMenuVisibility();
        return;
    }
    currentQualityMode = 'hls';
    currentQualitySources = levels.map((level, index) => ({
        label: getQualityLabel(level, index),
        level: index,
        hls
    }));
    currentQualityIndex = hls.currentLevel >= 0 ? hls.currentLevel : 0;
    qualityMenuAvailable = true;
    updateQualityMenu();
    showQualityButtons();
}

function setupQualityButtons(links, mode = 'links') {
    const container = $('qualityButtons');
    if (container) container.innerHTML = '';
    currentQualityMode = mode;
    currentQualitySources = [];
    qualityMenuAvailable = false;
    if (mode === 'links' && links.length > 1 && container) {
        links.forEach((link, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `quality-button${index === currentLinkIndex ? ' active' : ''}`;
            button.textContent = link.label || `رابط ${index + 1}`;
            button.title = link.label || `رابط ${index + 1}`;
            button.onclick = event => {
                event.stopPropagation();
                currentLinkIndex = index;
                currentQualityIndex = index;
                document.querySelectorAll('.quality-button').forEach((item, itemIndex) => {
                    item.classList.toggle('active', itemIndex === index);
                });
                const engineSelect = $('playerEngineSelect');
                if (engineSelect) engineSelect.value = 'auto';
                tryEnginesInParallel(link.url, 5);
                showPlayerControls();
            };
            container.appendChild(button);
        });
    }
    updateQualityMenu();
    showQualityButtons();
}

function cleanupNativePlayer() {
    const nativeEl = $('native-video');
    if (nativePlayerInstance && typeof nativePlayerInstance.destroy === 'function') nativePlayerInstance.destroy();
    nativePlayerInstance = null;
    if (nativeEl) {
        nativeEl.pause();
        nativeEl.src = '';
        nativeEl.classList.add('hidden');
    }
}

function cleanupPlayerJS() {
    const playerjsEl = $('playerjs-container');
    if (playerjsEngineInstance && typeof playerjsEngineInstance.destroy === 'function') playerjsEngineInstance.destroy();
    playerjsEngineInstance = null;
    if (playerjsEl) {
        playerjsEl.innerHTML = '';
        playerjsEl.classList.add('hidden');
    }
}

function initializePlayerJS(url, sourceToken = playerSourceToken) {
    const playerjsEl = $('playerjs-container');
    if (!playerjsEl) {
        setPlayerSource(url, 'native', false);
        return;
    }
    if (typeof window.Playerjs === 'undefined') {
        if (!attemptedFallbacks.native) {
            attemptedFallbacks.native = true;
            setPlayerSource(url, 'native', false);
            return;
        }
        if (!attemptedFallbacks.videojs) {
            attemptedFallbacks.videojs = true;
            setPlayerSource(url, 'videojs', false);
            return;
        }
        fallbackToNextLink();
        return;
    }
    cleanupPlayerJS();
    showActivePlayer('playerjs');
    playerjsEngineInstance = new Playerjs({ id: 'playerjs-container', file: url, autoplay: true });
    if (playerjsEngineInstance && typeof playerjsEngineInstance.on === 'function') {
        playerjsEngineInstance.on('error', () => {
            if (sourceToken !== playerSourceToken) return;
            if (!attemptedFallbacks.native) {
                attemptedFallbacks.native = true;
                setPlayerSource(url, 'native', false);
                return;
            }
            if (!attemptedFallbacks.videojs) {
                attemptedFallbacks.videojs = true;
                setPlayerSource(url, 'videojs', false);
                return;
            }
            fallbackToNextLink();
        });
    }
}

function showActivePlayer(engine) {
    cleanupAllPlayers();
    let id = '';
    switch(engine) {
        case 'videojs': case 'hlsjs': case 'flvjs': id = 'video-player'; break;
        case 'shaka': id = 'shaka-video'; break;
        case 'dashjs': id = 'dashjs-video'; break;
        case 'clappr': id = 'clappr-container'; break;
        case 'plyr': id = 'plyr-video'; break;
        case 'dplayer': id = 'dplayer-container'; break;
        case 'mediaelement': id = 'mediaelement-video'; break;
        case 'openplayer': id = 'openplayer-container'; break;
        case 'mediachrome': id = 'mediachrome-container'; break;
        case 'playerjs': id = 'playerjs-container'; break;
        case 'native': id = 'native-video'; break;
    }
    if (id && $(id)) $(id).classList.remove('hidden');
}

function ensureVideoElement() {
    let video = $('video-player');
    if (video) return video;
    const wrapper = $('player-wrapper');
    if (!wrapper) return null;
    video = document.createElement('video');
    video.id = 'video-player';
    video.className = 'video-js vjs-default-skin vjs-big-play-centered';
    video.setAttribute('playsinline', '');
    video.setAttribute('crossorigin', 'anonymous');
    const error = $('player-error-msg');
    wrapper.insertBefore(video, error || wrapper.firstChild);
    return video;
}

function initializeNativePlayer(url, sourceToken = playerSourceToken) {
    const nativeEl = $('native-video');
    if (!nativeEl) return;
    cleanupNativePlayer();
    showActivePlayer('native');
    nativeEl.controls = true;
    nativeEl.autoplay = true;
    nativeEl.playsInline = true;
    nativeEl.removeAttribute('src');
    nativeEl.load();
    if (url.includes('m3u8') && window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(nativeEl);
        nativePlayerInstance = hls;
    } else {
        nativeEl.src = url;
        nativePlayerInstance = nativeEl;
    }
    nativeEl.onloadedmetadata = () => nativeEl.play().catch(() => {});
    if (url.includes('m3u8') && window.Hls && Hls.isSupported()) {
        const hlsRef = nativePlayerInstance;
        hlsRef.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                hlsRef.destroy();
                fallbackToNextEngine(url, sourceToken);
            }
        });
    }
    nativeEl.onerror = () => {
        fallbackToNextEngine(url, sourceToken);
    };
}

function getMediaType(url) {
    try {
        const pathname = new URL(url, window.location.href).pathname.toLowerCase();
        if (pathname.endsWith('.m3u8')) return 'application/x-mpegURL';
        if (pathname.endsWith('.mpd')) return 'application/dash+xml';
        if (pathname.endsWith('.webm')) return 'video/webm';
        if (pathname.endsWith('.ogg') || pathname.endsWith('.ogv')) return 'video/ogg';
        if (pathname.endsWith('.flv')) return 'video/x-flv';
    } catch (error) {}
    return 'video/mp4';
}

function setPlayerSource(url, engine = 'videojs', resetFallbacks = true) {
    if (!url) return;

    const sourceToken = ++playerSourceToken;
    
    currentPlayerEngine = engine;
    if (resetFallbacks) {
        Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
        parallelEngineSuccessful = false;
    }
    attemptedFallbacks[engine] = true;
    showActivePlayer(engine);

    if (engine === 'videojs' || engine === 'hlsjs' || engine === 'flvjs') {
        if (!ensureVideoElement()) {
            fallbackToNextEngine(url, sourceToken);
            return;
        }
    }

    const engineSelect = $('playerEngineSelect');
    if (engineSelect) {
        engineSelect.value = engine;
    }

    try {
        switch(engine) {
            case 'videojs':
                videojsInstance = videojs('video-player', { autoplay: true, controls: true, responsive: true, fluid: false, preload: 'auto', muted: false });
                videojsInstance.src({ src: url, type: getMediaType(url) });
                videojsInstance.ready(function() {
                    if (sourceToken !== playerSourceToken) return;
                    this.play().catch(() => {});
                });
                videojsInstance.on('loadedmetadata', () => detectHlsQualities(videojsInstance));
                videojsInstance.one('playing', () => markPlayerReady(sourceToken));
                videojsInstance.on('error', () => { if (sourceToken === playerSourceToken) fallbackToNextEngine(url); });
                break;
            case 'hlsjs':
                if (Hls.isSupported()) {
                    hlsjsInstance = new Hls();
                    hlsjsInstance.loadSource(url);
                    const v = $('video-player');
                    hlsjsInstance.attachMedia(v);
                    hlsjsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        detectHlsJsQualities(hlsjsInstance);
                        v.play().catch(() => {});
                    });
                    v.addEventListener('playing', () => markPlayerReady(sourceToken), { once: true });
                    hlsjsInstance.on(Hls.Events.ERROR, (e, data) => { if (data.fatal && sourceToken === playerSourceToken) fallbackToNextEngine(url); });
                } else fallbackToNextEngine(url);
                break;
            case 'shaka':
                const sv = $('shaka-video');
                shakaPlayerInstance = new shaka.Player(sv);
                shakaPlayerInstance.load(url).then(() => {
                    markPlayerReady(sourceToken);
                    sv.play().catch(() => fallbackToNextEngine(url, sourceToken));
                }).catch(() => fallbackToNextEngine(url, sourceToken));
                shakaPlayerInstance.addEventListener('error', () => fallbackToNextEngine(url, sourceToken));
                break;
            case 'dashjs':
                const dv = $('dashjs-video');
                dashjsInstance = dashjs.MediaPlayer().create();
                dashjsInstance.initialize(dv, url, true);
                dv.play().catch(e => console.error("DASH Autoplay failed:", e));
                dashjsInstance.on('error', () => fallbackToNextEngine(url, sourceToken));
                break;
            case 'clappr':
                clapprInstance = new Clappr.Player({ source: url, parentId: '#clappr-container', autoPlay: true, mute: false });
                clapprInstance.on(Clappr.Events.PLAYER_READY, () => {
                    const cv = document.querySelector('#clappr-container video');
                    if (cv) cv.play().catch(e => console.error("Clappr Autoplay failed:", e));
                });
                clapprInstance.on(Clappr.Events.PLAYER_ERROR, () => fallbackToNextEngine(url, sourceToken));
                break;
            case 'plyr':
                const pv = $('plyr-video');
                plyrInstance = new Plyr(pv, { autoplay: true });
                pv.src = url;
                pv.play().catch(e => console.error("Plyr Autoplay failed:", e));
                pv.onerror = () => fallbackToNextEngine(url, sourceToken);
                break;
            case 'dplayer':
                dplayerInstance = new DPlayer({ container: $('dplayer-container'), video: { url: url, type: url.includes('m3u8') ? 'hls' : 'auto' }, autoplay: true });
                dplayerInstance.play();
                dplayerInstance.on('error', () => fallbackToNextEngine(url, sourceToken));
                break;
            case 'mediaelement':
                mediaelementInstance = new MediaElementPlayer('mediaelement-video', { 
                    success: (me) => { 
                        me.setSrc(url); 
                        me.play().catch(e => console.error("MediaElement Autoplay failed:", e));
                        me.addEventListener('error', () => fallbackToNextEngine(url, sourceToken));
                    },
                    error: () => fallbackToNextEngine(url, sourceToken)
                });
                break;
            case 'openplayer':
                openplayerInstance = new OpenPlayerJS('openplayer-container');
                openplayerInstance.init();
                openplayerInstance.src = { src: url, type: 'application/x-mpegURL' };
                const ov = document.querySelector('#openplayer-container video');
                if (ov) {
                    ov.play().catch(e => console.error("OpenPlayer Autoplay failed:", e));
                    ov.onerror = () => fallbackToNextEngine(url, sourceToken);
                }
                break;
            case 'mediachrome':
                const mv = $('mediachrome-video');
                mv.src = url;
                mv.play().catch(e => console.error("MediaChrome Autoplay failed:", e));
                mv.onerror = () => fallbackToNextEngine(url, sourceToken);
                break;
            case 'flvjs':
                if (flvjs.isSupported()) {
                    const fv = $('video-player');
                    flvjsInstance = flvjs.createPlayer({ type: 'flv', url: url });
                    flvjsInstance.attachMediaElement(fv);
                    flvjsInstance.load();
                    flvjsInstance.play().catch(e => console.error("FLV Autoplay failed:", e));
                    flvjsInstance.on(flvjs.Events.ERROR, () => fallbackToNextEngine(url, sourceToken));
                } else fallbackToNextEngine(url);
                break;
            case 'jwplayer':
                if (typeof jwplayer !== 'undefined') {
                    jwplayerInstance = jwplayer('jwplayer-container').setup({
                        file: url,
                        autostart: true,
                        mute: false,
                        width: '100%',
                        height: '100%'
                    });
                    jwplayerInstance.on('error', () => fallbackToNextEngine(url, sourceToken));
                    jwplayerInstance.on('setupError', () => fallbackToNextEngine(url, sourceToken));
                } else fallbackToNextEngine(url);
                break;
            case 'flowplayer':
                if (typeof flowplayer !== 'undefined') {
                    flowplayerInstance = flowplayer('#flowplayer-container', {
                        clip: { sources: [{ type: 'application/x-mpegurl', src: url }] },
                        autoplay: true
                    });
                    flowplayerInstance.on('error', () => fallbackToNextEngine(url, sourceToken));
                } else fallbackToNextEngine(url);
                break;
            case 'playerjs':
                initializePlayerJS(url, sourceToken);
                break;
            case 'native':
                initializeNativePlayer(url, sourceToken);
                break;
        }
    } catch(e) {
        console.error(`Error in engine ${engine}:`, e);
        fallbackToNextEngine(url, sourceToken);
    }
}

function showPlayerError(msg) {
    const el = $('player-error-msg');
    if (el) {
        el.textContent = msg;
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 3500);
    }
}

function hidePlayer() {
    stopAllMedia();
    cleanupAllPlayers();
    stopAllMedia();
    $('playerContainer').classList.add('hidden');
    const errorMsg = $('player-error-msg');
    if (errorMsg) errorMsg.classList.add('hidden');
    document.body.classList.remove('player-open');
    document.body.style.overflow = '';

    const videoElements = document.querySelectorAll('video');
    videoElements.forEach(video => {
        try {
            video.pause();
            video.muted = true;
            video.volume = 0;
            video.currentTime = 0;
        } catch (e) {}
    });

    const iframes = document.querySelectorAll('iframe');
    iframes.forEach(iframe => {
        try {
            if (iframe.src && (iframe.src.includes('youtube.com') || iframe.src.includes('youtu.be'))) {
                iframe.src = '';
            }
        } catch (e) {}
    });

    if (document.fullscreenElement) {
        document.exitFullscreen().catch(err => console.log("Exit fullscreen failed:", err));
    }
    if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
    }

    currentChannelId = null;
    currentPlayerEngine = null;
    currentChannelLinks = [];
    currentQualitySources = [];
}

window.addEventListener('pagehide', () => {
    stopAllMedia();
    cleanupAllPlayers();
});
window.addEventListener('beforeunload', stopAllMedia);
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') stopAllMedia();
});

async function selectChannel(channel, pushHistory = true) {
    const links = parseChannelLinks(channel);
    if (!links.length) {
        if ($('grid')) $('grid').innerHTML = '<div class="card message-card">لا يوجد رابط بث صالح لهذه القناة</div>';
        return;
    }
    currentChannelId = channel.id;
    currentChannelLinks = links;
    currentLinkIndex = 0;
    currentQualityIndex = 0;
    currentQualityMode = 'links';
    setupQualityButtons(links, 'links');
    showPlayer(pushHistory);
    
    tryEnginesInParallel(links[0].url, 5);
}

async function renderCurrentView() {
    const grid = $('grid');
    if (!grid) return;
    const currentId = currentStack.length ? currentStack[currentStack.length - 1] : null;
    
    const scrollPos = window.scrollY;
    
    grid.innerHTML = '';
    if (!currentId) {
        const roots = Object.values(categoriesCache)
            .filter(c => !c.parentId)
            .sort((a, b) => (a.order || 0) - (b.order || 0));
        if (!roots.length) {
            grid.innerHTML = '<div class="empty-section-msg">لا توجد أقسام مضافة بعد</div>';
            return;
        }
        roots.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${cat.img || DEFAULT_IMAGE}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${cat.name}</div>`;
            card.onclick = () => {
                                if (cat.link) { openExternalPage(cat.link); return; }
                currentStack.push(cat.id); pushState(); renderCurrentView();
            };
            grid.appendChild(card);
        });
        window.scrollTo(0, scrollPos);
        return;
    }
    const subs = Object.values(categoriesCache)
        .filter(c => c.parentId === currentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
    subs.forEach(sub => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${sub.img || DEFAULT_IMAGE}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${sub.name}</div>`;
        card.onclick = () => {
                        if (sub.link) { openExternalPage(sub.link); return; }
            currentStack.push(sub.id); pushState(); renderCurrentView();
        };
        grid.appendChild(card);
    });
    const channels = channelsCache.filter(ch => getChannelCategoryIds(ch).includes(currentId));
    if (!channels.length && !subs.length) {
        grid.innerHTML = '<div class="empty-section-msg">عذراً، لا توجد محتويات في هذا القسم حالياً</div>';
        return;
    }
    channels.forEach(ch => {
        if (!ch || !ch.id) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${ch.img || DEFAULT_IMAGE}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${ch.name}</div>`;
        card.onclick = () => selectChannel(ch);
        grid.appendChild(card);
    });
    window.scrollTo(0, scrollPos);
}

let playerControlsTimer = null;
function showPlayerControls() {
    const qButtons = $('qualityButtons');
    const qMenu = $('qualityMenu');
    if (qButtons) qButtons.classList.add('show');
    if (qMenu) qMenu.classList.add('show');

    if (playerControlsTimer) clearTimeout(playerControlsTimer);
    playerControlsTimer = setTimeout(() => {
        if (qMenu) qMenu.classList.remove('show');
        if (qButtons && !(currentQualityMode === 'links' && currentChannelLinks.length > 1)) {
            qButtons.classList.remove('show');
        }
    }, 3000);
}

function initVideoPlayer() {
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && $('playerContainer') && !$('playerContainer').classList.contains('hidden')) window.history.back();
    });

    const playerContainer = $('playerContainer');
    if (playerContainer) {
        ['mousemove', 'touchstart', 'click'].forEach(evt => {
            playerContainer.addEventListener(evt, showPlayerControls);
        });
    }

    const engineSelect = $('playerEngineSelect');
    if (engineSelect) {
        engineSelect.addEventListener('change', () => {
            if (currentChannelLinks && currentChannelLinks.length > 0) {
                const engine = engineSelect.value;
                if (engine !== 'auto') {
                    currentLinkIndex = 0;
                    currentQualityIndex = 0;
                    parallelEngineSuccessful = false;
                    Object.keys(attemptedFallbacks).forEach(key => attemptedFallbacks[key] = false);
                    setTimeout(() => {
                        setPlayerSource(currentChannelLinks[0].url, engine, true);
                        const sourceToken = playerSourceToken;
                        engineTimeoutHandle = setTimeout(() => {
                            if (sourceToken === playerSourceToken && !parallelEngineSuccessful) {
                                fallbackToNextEngine(currentChannelLinks[0].url, sourceToken);
                            }
                        }, 5000);
                        setupQualityButtons(currentChannelLinks, 'links');
                    }, 150);
                } else {
                    currentLinkIndex = 0;
                    currentQualityIndex = 0;
                    Object.keys(attemptedFallbacks).forEach(k => attemptedFallbacks[k] = false);
                    parallelEngineSuccessful = false;
                    setTimeout(() => {
                        tryEnginesInParallel(currentChannelLinks[0].url, 5);
                        setupQualityButtons(currentChannelLinks, 'links');
                    }, 150);
                }
            }
        });
    }
}

async function refreshCategoriesCache() {
    try {
        const catSnap = await database.ref('categories').once('value');
        const map = {};
        catSnap.forEach(c => { const value = c.val() || {}; map[c.key] = { id: c.key, ...value, parentId: String(value.parentId || value.parent || '') }; });
        categoriesCache = map;
    } catch (error) { categoriesCache = {}; }
}

async function refreshChannelsCache() {
    try {
        const chanSnap = await database.ref('channels').once('value');
        const list = [];
        chanSnap.forEach(ch => { list.push({ id: ch.key, ...ch.val() }); });
        channelsCache = list;
    } catch (error) { channelsCache = []; }
}

async function refreshSettings() {
    try {
        const snap = await database.ref('settings').once('value');
        const data = snap.val() || {};
        appSettings.matchesLink = data.matchesLink || DEFAULT_MATCHES_LINK;
        appSettings.matchesTitle = data.matchesTitle || 'مباريات اليوم';
        applySettings();
    } catch (error) { applySettings(); }
}

function applySettings() {
    const label = $('matchesNavLabel');
    if (label) label.textContent = appSettings.matchesTitle || 'مباريات اليوم';
}

async function refreshSidebarLinks() {
    try {
        const snap = await database.ref('sidebarLinks').once('value');
        const list = [];
        snap.forEach(item => {
            const val = item.val() || {};
            if (val.name && val.url) list.push({ id: item.key, ...val });
        });
        list.sort((a, b) => (a.order || 0) - (b.order || 0));
        sidebarLinksCache = list;
        renderSidebarLinks();
    } catch (error) { sidebarLinksCache = []; renderSidebarLinks(); }
}

async function init() {
    if (appInitialized) return;
    appInitialized = true;
    initVideoPlayer();
    currentStack = [];
    await Promise.all([refreshCategoriesCache(), refreshChannelsCache(), refreshSettings(), refreshSidebarLinks()]);
    const hashState = restoreHashState();
    currentStack = hashState.stack;
    currentChannelId = hashState.channelId;
    window.currentViewMode = hashState.viewMode;
    applyViewMode();
    await renderCurrentView();
    if (currentChannelId) {
        const channel = channelsCache.find(ch => ch.id === currentChannelId);
        if (channel) await selectChannel(channel, false);
    }
    try {
        database.ref('categories').on('value', (snapshot) => {
            const map = {};
            snapshot.forEach(c => { const value = c.val() || {}; map[c.key] = { id: c.key, ...value, parentId: String(value.parentId || value.parent || '') }; });
            categoriesCache = map;
            renderCurrentView();
            if (!$('searchModal')?.classList.contains('hidden')) renderSearchResults($('searchInput')?.value || '');
        }, (error) => { console.warn('Firebase categories error:', error); });
    } catch (e) { console.warn('Firebase categories listener error:', e); }
    try {
        database.ref('channels').on('value', (snapshot) => {
            const list = [];
            snapshot.forEach(ch => { list.push({ id: ch.key, ...ch.val() }); });
            channelsCache = list;
            renderCurrentView();
            if (!$('searchModal')?.classList.contains('hidden')) renderSearchResults($('searchInput')?.value || '');
        }, (error) => { console.warn('Firebase channels error:', error); });
    } catch (e) { console.warn('Firebase channels listener error:', e); }
    try {
        database.ref('settings').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            appSettings.matchesLink = data.matchesLink || DEFAULT_MATCHES_LINK;
            appSettings.matchesTitle = data.matchesTitle || 'مباريات اليوم';
            applySettings();
        }, (error) => { console.warn('Firebase settings error:', error); });
    } catch (e) { console.warn('Firebase settings listener error:', e); }
    try {
        database.ref('sidebarLinks').on('value', (snapshot) => {
            const list = [];
            snapshot.forEach(item => {
                const val = item.val() || {};
                if (val.name && val.url) list.push({ id: item.key, ...val });
            });
            list.sort((a, b) => (a.order || 0) - (b.order || 0));
            sidebarLinksCache = list;
            renderSidebarLinks();
        }, (error) => { console.warn('Firebase sidebarLinks error:', error); });
    } catch (e) { console.warn('Firebase sidebarLinks listener error:', e); }
}

function openSidebar() { document.body.classList.add('sidebar-open'); }
function closeSidebar() { document.body.classList.remove('sidebar-open'); }

function hideLightbox() {
    const lightbox = $('lightbox-alert');
    if (lightbox) {
        lightbox.style.display = 'none';
        localStorage.setItem('lightboxHidden', 'true');
    }
}

function goHome() {
    window.currentViewMode = 'home';
    window.currentExternalUrl = '';
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav) homeNav.classList.add('active');
    if (matchesNav) matchesNav.classList.remove('active');
    if ($('grid')) $('grid').classList.remove('hidden');
    if ($('matchesTableContainer')) $('matchesTableContainer').classList.add('hidden');
    if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
    currentStack = [];
    currentChannelId = null;
    pushState();
    renderCurrentView();
    if ($('playerContainer') && !$('playerContainer').classList.contains('hidden')) hidePlayer();
}

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('lightboxHidden') === 'true') {
        const lightbox = $('lightbox-alert');
        if (lightbox) lightbox.style.display = 'none';
    }

    const headerLogo = $('headerLogo');
    if (headerLogo) headerLogo.addEventListener('click', goHome);

    const qualityToggle = $('qualityToggle');
    if (qualityToggle) qualityToggle.addEventListener('click', toggleQualityMenu);
    const sidebarToggle = $('sidebarToggle');
    if (sidebarToggle) sidebarToggle.addEventListener('click', (event) => {
        event.stopPropagation();
        if (document.body.classList.contains('sidebar-open')) closeSidebar(); else openSidebar();
    });
    const sidebarOverlay = $('sidebarOverlay');
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

    const installAppButton = $('installAppButton');
    if (installAppButton) {
        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredInstallPrompt = event;
            installAppButton.classList.add('visible');
        });
        installAppButton.addEventListener('click', async () => {
            if (!deferredInstallPrompt) {
                const isInstalled = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
                alert(isInstalled
                    ? 'التطبيق مثبت بالفعل.'
                    : 'افتح قائمة المتصفح واختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".');
                return;
            }
            const installPrompt = deferredInstallPrompt;
            deferredInstallPrompt = null;
            try {
                await installPrompt.prompt();
                await installPrompt.userChoice;
            } finally {
                installAppButton.classList.remove('visible');
            }
        });
        window.addEventListener('appinstalled', () => installAppButton.classList.remove('visible'));
    }

    const searchToggle = $('searchToggle');
    if (searchToggle) searchToggle.addEventListener('click', openSearch);

    const searchClose = $('searchClose');
    if (searchClose) searchClose.addEventListener('click', closeSearch);

    const searchClear = $('searchClear');
    if (searchClear) searchClear.addEventListener('click', () => {
        const input = $('searchInput');
        if (!input) return;
        input.value = '';
        renderSearchResults('');
        input.focus();
    });

    const searchModal = $('searchModal');
    if (searchModal) searchModal.addEventListener('click', (e) => {
        if (e.target === searchModal) closeSearch();
    });

    const searchInput = $('searchInput');
    if (searchInput) {
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSearch();
        });
        searchInput.addEventListener('input', (e) => {
            renderSearchResults(e.target.value);
        });
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !$('searchModal')?.classList.contains('hidden')) closeSearch();
    });

    document.addEventListener('click', (e) => {
        if (!document.body.classList.contains('sidebar-open')) return;
        const sidebar = $('sidebar');
        const sidebarToggle = $('sidebarToggle');
        if (sidebar && sidebar.contains(e.target)) return;
        if (sidebarToggle && sidebarToggle.contains(e.target)) return;
        closeSidebar();
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=7', { updateViaCache: 'none' }).catch(err => console.warn('SW registration failed:', err));
    }

    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav) homeNav.addEventListener('click', goHome);
    if (matchesNav) {
        matchesNav.addEventListener('click', () => {
            openExternalPage(appSettings.matchesLink || DEFAULT_MATCHES_LINK);
        });
    }
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

function closeExternalLink() {
    window.currentViewMode = 'home';
    window.currentExternalUrl = '';
    if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
    if ($('grid')) $('grid').classList.remove('hidden');
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav) homeNav.classList.add('active');
    if (matchesNav) matchesNav.classList.remove('active');
    if ($('externalLinkIframe')) $('externalLinkIframe').src = '';
    pushState();
}

function openMatchLink(url) {
    if (!url) return;
    openExternalPage(url);
}
    </script>
