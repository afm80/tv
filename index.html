<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfaham TV</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family: 'Cairo', sans-serif;
    background: url('https://h.top4top.io/p_3784nirj21.png') center / cover no-repeat fixed;
    min-height: 100vh;
    margin: 0;
}

.site-header {
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 100000;
    height: 64px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    padding: 0 14px;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(14px);
    color: #fff;
}

.site-title {
    font-weight: 700;
    font-size: 18px;
    text-align: center;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
}

.sidebar-toggle,
.nav-item,
.sidebar-close,
.search-toggle {
    border: none;
    background: transparent;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
}

.sidebar-toggle {
    font-size: 22px;
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.search-toggle {
    font-size: 20px;
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    justify-self: start;
}

.header-actions {
    grid-column: 3;
    display: flex;
    align-items: center;
    justify-self: end;
    gap: 6px;
}

.install-app-button {
    display: inline-flex;
    width: 100%;
    min-width: 0;
    min-height: 42px;
    margin-top: 14px;
    padding: 8px 10px;
    align-items: center;
    justify-content: center;
    gap: 7px;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
    background: rgba(255,255,255,.08);
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
}

.install-app-button i { flex: 0 0 auto; }
.install-app-button span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.install-app-button.visible { background: #ff6600; border-color: #ff6600; }

.site-logo {
    height: 48px;
    width: auto;
    object-fit: contain;
    display: flex;
    align-items: center;
    justify-content: center;
}

.site-logo-center {
    position: static;
    grid-column: 2;
    justify-self: center;
    height: 48px;
    width: auto;
    max-width: min(220px, 100%);
    min-width: 0;
    object-fit: contain;
    cursor: pointer;
    z-index: 10;
    background: transparent;
    mix-blend-mode: normal;
    filter: none;
}

.sidebar-overlay {
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.45);
    z-index: 99998;
    display: none;
}

.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    color: #ffffff;
    padding: 0;
    border-radius: 0;
    font-weight: 700;
    z-index: 100001;
    box-shadow: none;
    max-width: calc(100% - 32px);
    text-align: center;
    pointer-events: none;
}

.card.message-card {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    box-shadow: none;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.hidden {
    display: none !important;
}

.sidebar-overlay.hidden {
    display: none;
}

.sidebar {
    position: fixed;
    top: 64px;
    left: 0;
    height: calc(100vh - 64px);
    width: 40vw;
    max-width: 40vw;
    background: rgba(0, 0, 0, 0.98);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 1000001;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--primary) transparent;
}

.sidebar::-webkit-scrollbar {
    width: 4px;
}

.sidebar::-webkit-scrollbar-track {
    background: transparent;
}

.sidebar::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 10px;
}

.sidebar-open .sidebar {
    transform: translateX(0);
}

.sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.sidebar-title {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
}

.sidebar-close {
    border: none;
    background: transparent;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    line-height: 1;
}

.sidebar-open .sidebar-overlay {
    display: block;
}

.sidebar-brand {
    padding: 18px 20px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-bottom: 0;
}

.sidebar-logo {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-name {
    font-size: 18px;
    font-weight: 800;
    margin-top: 15px;
    color: #ffffff;
}

.sidebar-section {
    padding: 0 20px 20px;
}

.sidebar-section-title {
    font-size: 12px;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 15px;
    font-weight: 700;
}

.sidebar-link {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 8px;
    padding: 10px 8px;
    color: #ffffff;
    text-decoration: none;
    border-radius: 12px;
    transition: all 0.3s ease;
    margin-bottom: 5px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
}

.sidebar-link i {
    width: 20px;
    flex: 0 0 20px;
    text-align: center;
    font-size: 18px;
    color: #ffffff;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.sidebar-link-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sidebar-link:hover,
.sidebar-link:active {
    background: rgba(255, 102, 0, 0.15);
    color: #FF6600;
}

.sidebar-link:hover i,
.sidebar-link:active i {
    color: #FF6600;
}

.search-modal {
    position: fixed;
    inset: 0;
    z-index: 1000002;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 88px 16px 24px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(10px);
}
.search-modal.hidden { display:none; }
.search-box { width:min(620px,100%); background:#171717; border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:16px; box-shadow:0 20px 70px rgba(0,0,0,.5); }
.search-head { display:flex; gap:10px; align-items:center; }
.search-input-wrap { position:relative; flex:1; min-width:0; }
.search-input { width:100%; min-width:0; border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:12px 42px 12px 12px; background:#0c0c0c; color:#fff; font:inherit; }
.search-input:focus { outline:2px solid rgba(255,140,0,.7); outline-offset:1px; border-color:#ff8c00; }
.search-clear { position:absolute; top:50%; right:10px; transform:translateY(-50%); display:none; border:0; background:transparent; color:rgba(255,255,255,.65); font-size:20px; line-height:1; cursor:pointer; padding:4px; }
.search-clear.visible { display:block; }
.search-clear:hover { color:#fff; }
.search-close { border:0; background:transparent; color:#fff; font-size:24px; cursor:pointer; }
.search-results { max-height:60vh; overflow:auto; margin-top:12px; }
.search-result { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; border:0; border-bottom:1px solid rgba(255,255,255,.08); background:transparent; color:#fff; text-align:right; padding:12px 4px; cursor:pointer; font:inherit; }
.search-result:hover, .search-result:focus-visible { color:#ff8c00; background:rgba(255,140,0,.08); outline:none; }
.search-result-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search-result-type { flex:0 0 auto; color:rgba(255,255,255,.5); font-size:12px; }
.search-empty, .search-hint { color:rgba(255,255,255,.6); text-align:center; padding:24px 12px; }

.bottom-nav {
    position: fixed;
    inset: auto 0 0 0;
    z-index: 100000;
    display: flex;
    justify-content: center;
    align-items: stretch;
    height: 64px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    gap: 0;
}

.nav-item {
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 0;
    border-radius: 0;
    flex: 1;
    transition: all 0.3s ease;
    height: 100%;
    opacity: 0.6;
    font-weight: 700;
    font-size: 13px;
}

.nav-item.active {
    background: #000000 !important;
    color: #ff8c00 !important;
    opacity: 1;
    font-size: 14px;
}

.nav-item:hover {
    opacity: 0.8;
}

.nav-icon {
    font-size: 18px;
    color: #fff;
}

.content-container {
    width: min(100%, 1400px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 94px 16px 100px;
    margin: 0 auto;
    overflow-y: auto;
}

.player-open .site-header,
.player-open .bottom-nav,
.player-open .sidebar,
.player-open .sidebar-overlay,
.player-open .content-container {
    display: none !important;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 110px);
    gap: 8px;
    justify-content: center;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
}

.card {
    background-color: rgba(255, 255, 255, 0.92);
    border-radius: 8px;
    width: 110px;
    padding: 6px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s ease;
    cursor: pointer;
    border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
}

.card-title {
    margin-top: 4px;
    font-size: clamp(11px, 1.5vw, 13px);
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-align: center;
    font-weight: 700;
}

.player-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('https://h.top4top.io/p_3784nirj21.png') center / cover no-repeat fixed;
    color: #fff;
    z-index: 99999;
    display: block;
    overflow-y: auto;
}

.player-container.hidden {
    display: none !important;
}

/* ===== المشغل الجديد (منقول حرفياً) ===== */
.splash-spinner{width:48px;height:48px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ff6600;border-right-color:#ff6600;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.player-loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.55);z-index:4;color:#fff;font-size:13px;font-weight:700;}
.player-loader.show{display:flex;}
.player-loader .splash-spinner{width:40px;height:40px;}
.player-failure{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.85);z-index:5;color:#fff;padding:16px;text-align:center;}
.player-failure.show{display:flex;}
.player-failure p{margin:0;font-size:13px;}
.player-failure button{background:#fff;border:none;color:#000;padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:700;}
#satPlayer{display:block;max-width:900px;margin:20px auto;padding:16px;}
#satPlayer .video-wrap{position:relative;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3);background:#000;aspect-ratio:16/9;}
#satPlayer video,#satPlayer iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000;}
#satMsg{color:#fff;background:rgba(0,0,0,.7);padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none;}
#satPlayer .player-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px;}
#satPlayer .player-controls select,#satPlayer .quality-button,#satPlayer .quality-toggle{border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(0,0,0,.75);color:#fff;padding:8px 12px;font:inherit;cursor:pointer;}
#satPlayer .player-switch{border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(0,0,0,.75);color:#fff;padding:8px 12px;font:inherit;cursor:pointer;}
#satPlayer .player-switch:hover,#satPlayer .player-switch.active{background:#ffc107;color:#000;}
#satPlayer .retry-switch{order:-1;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(0,0,0,.75);color:#fff;width:34px;height:34px;padding:0;font:inherit;font-size:20px;font-weight:900;cursor:pointer;}
#satPlayer .retry-switch:hover{background:#ffc107;color:#000;transform:rotate(90deg);}
#satPlayer .retry-switch[hidden]{display:none;}
#satPlayer .quality-button.active,#satPlayer .quality-button:hover,#satPlayer .quality-toggle:hover{background:#ffc107;color:#000;}
#satPlayer .quality-toggle{display:none;}
#satPlayer .quality-menu{position:relative;display:inline-flex;}
#satPlayer .quality-options{position:absolute;bottom:calc(100% + 6px);right:0;display:none;min-width:130px;padding:5px;border-radius:8px;background:rgba(0,0,0,.9);z-index:4;}
#satPlayer .quality-options.open{display:grid;gap:4px;}
#satPlayer .quality-options button{border:0;border-radius:5px;padding:7px 9px;background:transparent;color:#fff;cursor:pointer;text-align:right;}
#satPlayer .quality-options button:hover{background:#ffc107;color:#000;}
#satPlayer{padding:10px;margin:10px auto;}
#satPlayer .video-wrap{border-radius:16px;}
#satPlayer .player-controls select,#satPlayer .quality-button,#satPlayer .quality-toggle,#satPlayer .player-switch{min-height:42px;border-radius:12px;}
#playerContainer #satPlayer{display:block;}
#satPlayer .player-controls select,#satPlayer .player-switch,#satPlayer .quality-toggle,#satPlayer .quality-button,#satPlayer .quality-options button{font-weight:900;font-size:15px;letter-spacing:.2px;}

/* شريط روابط القناة: أعلى يسار المشغل، يتمرر أفقياً ويختفي عند عدم التفاعل */
#satPlayer .sat-link-buttons{position:absolute;top:6px;left:0;max-width:calc(100% - 10px);z-index:6;display:flex;flex-wrap:nowrap;gap:6px;direction:ltr;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:none;padding:4px 10px;border-radius:0;box-sizing:border-box;opacity:1;transform:translateY(0);transition:opacity .3s ease,transform .3s ease;}
#satPlayer .sat-link-buttons::-webkit-scrollbar{display:none;}
#satPlayer .sat-link-buttons:empty{display:none;}
#satPlayer .sat-link-buttons.idle{opacity:0;transform:translateY(-8px);pointer-events:none;}
#satPlayer .link-chip{flex:0 0 auto;direction:rtl;display:inline-flex;align-items:center;min-height:32px;padding:0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s,transform .15s;}
#satPlayer .link-chip:hover{background:rgba(255,255,255,.34);}
#satPlayer .link-chip:active{transform:scale(.95);}
#satPlayer .link-chip.active{background:#ffc107;color:#000;text-shadow:none;}
@media (max-width:600px){#satPlayer .sat-link-buttons{top:4px;left:0;max-width:100%;}#satPlayer .link-chip{min-height:30px;padding:0 12px;font-size:12px;}}

.matches-table-container,
.external-link-container {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    direction: rtl;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100001;
    background: #000;
}

#matchesIframe,
#externalLinkIframe {
    width: 100%;
    height: 100%;
    background: #000;
    border: none;
}

.external-link-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 12px 18px;
    background: rgba(0, 0, 0, 0.92);
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky;
    top: 0;
    z-index: 100002;
}

.external-link-title {
    font-weight: 700;
    font-size: 14px;
    color: #ffcc00;
}

.close-embed-btn {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 700;
}

.close-embed-btn:hover {
    background: rgba(255,255,255,0.15);
}

.message-card {
    background: rgba(0, 0, 0, 0.4) !important;
    color: #fff !important;
    border: none !important;
    font-size: 13px;
    padding: 10px 20px !important;
    border-radius: 20px !important;
    width: auto !important;
    min-height: auto !important;
    box-shadow: none !important;
}

.matches-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 14px;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

@media (min-width: 769px) {
    .matches-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 768px) {
    .content-container {
        padding: 84px 12px 100px;
    }

    .site-header {
        padding: 0 10px;
    }

    .sidebar {
        width: 40vw;
        max-width: 40vw;
    }

    .sidebar-section {
        padding: 0 8px 10px;
    }

    .sidebar-brand {
        padding: 16px 8px 0;
    }

    .card {
        min-height: 130px;
        padding: 8px;
    }
}

.match-card {
    text-decoration: none;
    display: block;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s ease;
    aspect-ratio: 1080 / 480;
    width: 100%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.match-card:hover {
    transform: scale(1.04);
}

.match-card img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
    border-radius: 12px;
}

.empty-section-msg {
    grid-column: 1 / -1;
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 14px;
    padding: 40px 20px;
    font-weight: 700;
}

.lightbox { display: flex; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 999999; }

.icon-alert { color: #ff5722; margin-bottom: 10px; }
.lightbox-content h2 { margin: 10px 0; color: #081828; font-size: 18px; }

.button-group { display: flex; justify-content: space-between; gap: 10px; }

.btn-download { background-color: #007bff; color: #fff; }
.btn-download:hover { background-color: #0056b3; }

.match_today.container { width: 100%; max-width: 100%; padding: 0; background: transparent; }

#clock { font-size: 0.6em; margin-top: 1px; }

// شريط الروابط: يظهر عند اللمس/الحركة ويختفي بعد ثوانٍ من عدم التفاعل
const satLinkBar = (() => {
    const IDLE_MS = 3500;
    let timer = null;
    const box = () => $('satLinkButtons');
    const wrap = () => $('satVideoWrap');
    const update = () => {
        const b = box(); if (!b) return;
        const max = b.scrollWidth - b.clientWidth;
        const x = Math.abs(b.scrollLeft);
        b.classList.toggle('fade-l', max > 2 && x > 2);
        b.classList.toggle('fade-r', max > 2 && x < max - 2);
    };
    const schedule = () => {
        clearTimeout(timer);
        timer = setTimeout(() => { box()?.classList.add('idle'); }, IDLE_MS);
    };
    const wake = () => {
        const b = box(); if (!b || !b.children.length) return;
        b.classList.remove('idle');
        update();
        schedule();
    };
    const w = wrap(), b = box();
    if (w && b) {
        ['pointermove', 'pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => w.addEventListener(ev, wake, { passive: true }));
        const v = $('satVideoEl');
        if (v) ['pause', 'play', 'playing', 'waiting'].forEach(ev => v.addEventListener(ev, wake));
        b.addEventListener('scroll', () => { update(); wake(); }, { passive: true });
        b.addEventListener('wheel', e => {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { b.scrollLeft += e.deltaY; e.preventDefault(); }
            wake();
        }, { passive: false });
        window.addEventListener('resize', update);
    }
    return { wake, update };
})();

  var token=satEngineToken;

  var engines=[];
  var variants=buildUrlVariants(url);
  for(var v=0;v<variants.length;v++){for(var e=0;e<baseEngines.length;e++){engines.push({engine:baseEngines[e],url:variants[v]});}}

function getSidebarIcon(link) {
    const storedIcon = String(link.icon || '').trim();
    if (/^(?:fab|fas|far|fa-brands|fa-solid|fa-regular)\s+fa-[\w-]+$/i.test(storedIcon)) return storedIcon;
    const icons = {
        youtube: 'fab fa-youtube', facebook: 'fab fa-facebook', instagram: 'fab fa-instagram',
        tiktok: 'fab fa-tiktok', x: 'fab fa-x-twitter', twitter: 'fab fa-x-twitter',
        whatsapp: 'fab fa-whatsapp', telegram: 'fab fa-telegram', snapchat: 'fab fa-snapchat',
        store: 'fas fa-store'
    };
    const platform = String(link.platform || '').toLowerCase();
    if (icons[platform]) return icons[platform];
    try {
        const hostname = new URL(link.url).hostname.toLowerCase().replace(/^www\./, '');
        const domain = Object.keys(icons).find(key => hostname === `${key}.com` || hostname.endsWith(`.${key}.com`));
        if (domain) return icons[domain];
        if (hostname.includes('store')) return icons.store;
    } catch (error) {}
    return 'fas fa-link';
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function normalizeSearchText(value) {
    return String(value || '')
        .normalize('NFD')
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/[إأآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .toLowerCase()
        .trim();
}

function renderSearchResults(query) {
    const results = $('searchResults');
    if (!results) return;
    const term = normalizeSearchText(query);
    const clearButton = $('searchClear');
    if (clearButton) clearButton.classList.toggle('visible', Boolean(term));
    if (!term) {
        results.innerHTML = '<div class="search-hint">اكتب اسم قسم أو قناة للبحث</div>';
        return;
    }
        const categories = Object.values(categoriesCache).map(category => ({type:'قسم', name:category.name, action:()=>{ if(category.link){closeSearch();openExternalPage(category.link);return;}currentStack=[category.id];currentChannelId=null;window.currentViewMode='home';pushState();renderCurrentView();closeSearch();}}));
    const channels = channelsCache.map(channel => ({type:'قناة', name:channel.name, action:()=>{selectChannel(channel);closeSearch();}}));
    const matches = [...categories,...channels].filter(item => !term || normalizeSearchText(item.name).includes(term)).slice(0,50);
    results.innerHTML = matches.length ? matches.map((item,index)=>`<button class="search-result" type="button" data-search-index="${index}"><strong class="search-result-name">${escapeHtml(item.name)}</strong><small class="search-result-type">${item.type}</small></button>`).join('') : '<div class="search-empty">لا توجد نتائج مطابقة</div>';
    results.querySelectorAll('[data-search-index]').forEach((button,index)=>button.onclick=()=>matches[index].action());
}

function openExternalPage(url, replaceCurrent = false) {
    try {
        const target = new URL(url, window.location.href);
        if (!['http:', 'https:'].includes(target.protocol)) return;
        if (replaceCurrent) window.location.replace(target.href);
        else window.location.assign(target.href);
    } catch (error) {
        console.warn('Invalid external link:', error);
    }
}

function applyViewMode() {
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');

    if (window.currentViewMode !== 'externalLink' && $('externalLinkIframe')) {
        $('externalLinkIframe').removeAttribute('src');
    }
    
    if (currentChannelId) {
        $('playerContainer').classList.remove('hidden');
        document.body.classList.add('player-open');
    } else {
        $('playerContainer').classList.add('hidden');
        document.body.classList.remove('player-open');
    }

    if (window.currentViewMode === 'matches') {
        if ($('grid')) $('grid').classList.add('hidden');
        if ($('matchesGrid')) $('matchesGrid').classList.remove('hidden');
        if ($('matchesTableContainer')) $('matchesTableContainer').classList.add('hidden');
        if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
        if (matchesNav) matchesNav.classList.add('active');
        if (homeNav) homeNav.classList.remove('active');
    } else if (window.currentViewMode === 'matchesTable') {
        if ($('grid')) $('grid').classList.add('hidden');
        if ($('matchesGrid')) $('matchesGrid').classList.add('hidden');
        if ($('matchesTableContainer')) $('matchesTableContainer').classList.remove('hidden');
        if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
        if (matchesNav) matchesNav.classList.add('active');
        if (homeNav) homeNav.classList.remove('active');
    } else if (window.currentViewMode === 'externalLink') {
        openExternalPage(window.currentExternalUrl, true);
        return;
    } else {
        /* عرض الشبكة الرئيسية */
        if ($('grid')) $('grid').classList.remove('hidden');
        if ($('matchesGrid')) $('matchesGrid').classList.add('hidden');
        if ($('matchesTableContainer')) $('matchesTableContainer').classList.add('hidden');
        if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
        if (homeNav) homeNav.classList.add('active');
        if (matchesNav) matchesNav.classList.remove('active');
        /* نظّف الـ hash إذا كان يبدأ بـ ext: */
        if (window.location.hash.startsWith('#ext:')) {
            try {
                history.replaceState({
                    path: 'navigation',
                    stack: [...currentStack],
                    channelId: null,
                    viewMode: 'home',
                    externalUrl: ''
                }, '', window.location.pathname + window.location.search);
            } catch(e) {}
        }
    }
}

function serializeStack(stack) {
    return stack.filter(Boolean).join(',');
}

function buildHash(stack, channelId) {
    if (window.currentViewMode === 'matches') return 'matches';
    if (window.currentViewMode === 'matchesTable') return 'matchesTable';
    if (window.currentViewMode === 'externalLink' && window.currentExternalUrl) return `ext:${encodeURIComponent(window.currentExternalUrl)}`;
    const stackHash = serializeStack(stack);
    if (!stackHash && !channelId) return '';
    return channelId ? `${stackHash}|${channelId}` : stackHash;
}

function pushState() {
    const hash = buildHash(currentStack, currentChannelId);
    const url = `${window.location.pathname}${window.location.search}${hash ? `#${hash}` : ''}`;
    window.history.pushState({ 
        path: 'navigation', 
        stack: [...currentStack], 
        channelId: currentChannelId,
        viewMode: window.currentViewMode,
        externalUrl: window.currentExternalUrl 
    }, '', url);
}

function restoreHashState() {
    const raw = window.location.hash.slice(1);
    if (!raw) return { stack: [], channelId: null, viewMode: 'home', externalUrl: '' };
    if (raw === 'matches') return { stack: [], channelId: null, viewMode: 'matches', externalUrl: '' };
    if (raw === 'matchesTable') return { stack: [], channelId: null, viewMode: 'matchesTable', externalUrl: '' };
    if (raw.startsWith('ext:')) {
        try {
            const externalUrl = decodeURIComponent(raw.slice(4));
            const parsed = new URL(externalUrl, window.location.href);
            if (['http:', 'https:'].includes(parsed.protocol)) {
                return { stack: [], channelId: null, viewMode: 'externalLink', externalUrl: parsed.href };
            }
        } catch (error) {}
        return { stack: [], channelId: null, viewMode: 'home', externalUrl: '' };
    }
    const [stackPart, channelId] = raw.split('|');
    const ids = stackPart ? stackPart.split(',').filter(Boolean) : [];
    const validStack = [];
    ids.forEach((id, index) => {
        if (!categoriesCache[id]) return;
        if (index === 0 || categoriesCache[id].parentId === validStack[index - 1]) {
            validStack.push(id);
        }
    });
    return { stack: validStack, channelId: channelId || null, viewMode: 'home', externalUrl: '' };
}

function getDescendants(rootId) {
    const ids = [rootId];
    for (let i = 0; i < ids.length; i++) {
        Object.values(categoriesCache).forEach(c => {
            if (c.parentId === ids[i] && !ids.includes(c.id)) ids.push(c.id);
        });
    }
    return ids;
}

function getChannelCategoryIds(channel) {
    if (!channel) return [];
    let ids = [];
    if (channel.categoryIds) {
        ids = Array.isArray(channel.categoryIds) ? channel.categoryIds : Object.values(channel.categoryIds);
    } else if (channel.categories) {
        ids = Array.isArray(channel.categories) ? channel.categories : Object.values(channel.categories);
    } else if (channel.categoryId) {
        ids = [channel.categoryId];
    } else if (channel.catId) {
        ids = [channel.catId];
    }
    return ids.map(id => String(id)).filter(id => id && id !== 'undefined');
}

function parseChannelLinks(ch) {
    const links = [];
    if (ch.links && typeof ch.links === 'object') {
        Object.keys(ch.links).forEach(key => {
            const entry = ch.links[key];
            if (entry && entry.url) {
                links.push({ label: entry.label || key, url: entry.url });
            } else if (typeof entry === 'string') {
                links.push({ label: key, url: entry });
            }
        });
    }
    ['mainLink', 'hdLink', 'sdLink', 'backupLink', 'url', 'stream', 'src', 'play', 'link', 'video', 'm3u8', 'mp4'].forEach(prop => {
        if (ch[prop] && typeof ch[prop] === 'string' && !links.some(l => l.url === ch[prop])) {
            links.push({ label: prop, url: ch[prop] });
        }
    });
    if (ch.url && typeof ch.url === 'string' && !links.some(l => l.url === ch.url)) {
        links.push({ label: 'الرئيسي', url: ch.url });
    }
    const priority = ['الرئيسي', 'main', 'auto', 'Auto', 'AUTO'];
    links.sort((a, b) => {
        const aIndex = priority.findIndex(label => a.label.includes(label));
        const bIndex = priority.findIndex(label => b.label.includes(label));
        if (aIndex === -1 && bIndex === -1) return 0;
        if (aIndex === -1) return 1;
        if (bIndex === -1) return -1;
        return aIndex - bIndex;
    });
    return links;
}

async function renderCurrentView() {
    const grid = $('grid');
    if (!grid) return;
    const currentId = currentStack.length ? currentStack[currentStack.length - 1] : null;
    
    const scrollPos = window.scrollY;
    
    grid.innerHTML = '';
    if (!currentId) {
        const roots = Object.values(categoriesCache)
            .filter(c => !c.parentId)
            .sort((a, b) => (a.order || 0) - (b.order || 0));
        if (!roots.length) {
            grid.innerHTML = '<div class="empty-section-msg">لا توجد أقسام مضافة بعد</div>';
            return;
        }
        roots.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${escapeHtml(cat.img || DEFAULT_IMAGE)}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${escapeHtml(cat.name)}</div>`;
            card.onclick = () => {
                                if (cat.link) { openExternalPage(cat.link); return; }
                currentStack.push(cat.id); pushState(); renderCurrentView();
            };
            grid.appendChild(card);
        });
        window.scrollTo(0, scrollPos);
        return;
    }
    const subs = Object.values(categoriesCache)
        .filter(c => c.parentId === currentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
    subs.forEach(sub => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${escapeHtml(sub.img || DEFAULT_IMAGE)}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${escapeHtml(sub.name)}</div>`;
        card.onclick = () => {
                        if (sub.link) { openExternalPage(sub.link); return; }
            currentStack.push(sub.id); pushState(); renderCurrentView();
        };
        grid.appendChild(card);
    });
    const channels = channelsCache.filter(ch => getChannelCategoryIds(ch).includes(currentId));
    if (!channels.length && !subs.length) {
        grid.innerHTML = '<div class="empty-section-msg">عذراً، لا توجد محتويات في هذا القسم حالياً</div>';
        return;
    }
    channels.forEach(ch => {
        if (!ch || !ch.id) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${escapeHtml(ch.img || DEFAULT_IMAGE)}" onerror="this.src='${DEFAULT_IMAGE}'"><div class="card-title">${escapeHtml(ch.name)}</div>`;
        card.onclick = () => selectChannel(ch);
        grid.appendChild(card);
    });
    window.scrollTo(0, scrollPos);
}

async function refreshCategoriesCache() {
    try {
        const catSnap = await database.ref('categories').once('value');
        const map = {};
        catSnap.forEach(c => { const value = c.val() || {}; map[c.key] = { id: c.key, ...value, parentId: String(value.parentId || value.parent || '') }; });
        categoriesCache = map;
    } catch (error) { categoriesCache = {}; }
}

async function refreshChannelsCache() {
    try {
        const chanSnap = await database.ref('channels').once('value');
        const list = [];
        chanSnap.forEach(ch => { list.push({ id: ch.key, ...ch.val() }); });
        channelsCache = list;
    } catch (error) { channelsCache = []; }
}

async function refreshSettings() {
    try {
        const snap = await database.ref('settings').once('value');
        const data = snap.val() || {};
        appSettings.matchesLink = data.matchesLink || DEFAULT_MATCHES_LINK;
        appSettings.matchesTitle = data.matchesTitle || 'مباريات اليوم';

async function refreshSidebarLinks() {
    try {
        const snap = await database.ref('sidebarLinks').once('value');
        const list = [];
        snap.forEach(item => {
            const val = item.val() || {};
            if (val.name && val.url) list.push({ id: item.key, ...val });
        });
        list.sort((a, b) => (a.order || 0) - (b.order || 0));
        sidebarLinksCache = list;
        renderSidebarLinks();
    } catch (error) { sidebarLinksCache = []; renderSidebarLinks(); }
}

async function init() {
    if (appInitialized) return;
    appInitialized = true;
    initVideoPlayer();
    currentStack = [];
    await Promise.all([refreshCategoriesCache(), refreshChannelsCache(), refreshSettings(), refreshSidebarLinks()]);
    const hashState = restoreHashState();
    currentStack = hashState.stack;
    currentChannelId = hashState.channelId;
    window.currentViewMode = hashState.viewMode;
    applyViewMode();
    await renderCurrentView();
    if (currentChannelId) {
        const channel = channelsCache.find(ch => ch.id === currentChannelId);
        if (channel) await selectChannel(channel, false);
    }
    try {
        database.ref('categories').on('value', (snapshot) => {
            const map = {};
            snapshot.forEach(c => { const value = c.val() || {}; map[c.key] = { id: c.key, ...value, parentId: String(value.parentId || value.parent || '') }; });
            categoriesCache = map;
            renderCurrentView();
            if (!$('searchModal')?.classList.contains('hidden')) renderSearchResults($('searchInput')?.value || '');
        }, (error) => { console.warn('Firebase categories error:', error); });
    } catch (e) { console.warn('Firebase categories listener error:', e); }
    try {
        database.ref('channels').on('value', (snapshot) => {
            const list = [];
            snapshot.forEach(ch => { list.push({ id: ch.key, ...ch.val() }); });
            channelsCache = list;
            renderCurrentView();
            if (!$('searchModal')?.classList.contains('hidden')) renderSearchResults($('searchInput')?.value || '');
        }, (error) => { console.warn('Firebase channels error:', error); });
    } catch (e) { console.warn('Firebase channels listener error:', e); }
    try {
        database.ref('settings').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            appSettings.matchesLink = data.matchesLink || DEFAULT_MATCHES_LINK;
            appSettings.matchesTitle = data.matchesTitle || 'مباريات اليوم';
            applySettings();
        }, (error) => { console.warn('Firebase settings error:', error); });
    } catch (e) { console.warn('Firebase settings listener error:', e); }
    try {
        database.ref('sidebarLinks').on('value', (snapshot) => {
            const list = [];
            snapshot.forEach(item => {
                const val = item.val() || {};
                if (val.name && val.url) list.push({ id: item.key, ...val });
            });
            list.sort((a, b) => (a.order || 0) - (b.order || 0));
            sidebarLinksCache = list;
            renderSidebarLinks();
        }, (error) => { console.warn('Firebase sidebarLinks error:', error); });
    } catch (e) { console.warn('Firebase sidebarLinks listener error:', e); }
}

    const matchesNav = $('matchesNav');
    if (homeNav) homeNav.classList.add('active');
    if (matchesNav) matchesNav.classList.remove('active');
    if ($('grid')) $('grid').classList.remove('hidden');
    if ($('matchesTableContainer')) $('matchesTableContainer').classList.add('hidden');
    if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
    currentStack = [];
    currentChannelId = null;
    pushState();
    renderCurrentView();
    if ($('playerContainer') && !$('playerContainer').classList.contains('hidden')) hidePlayer();
}

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('lightboxHidden') === 'true') {
        const lightbox = $('lightbox-alert');
        if (lightbox) lightbox.style.display = 'none';
    }

    const headerLogo = $('headerLogo');
    if (headerLogo) headerLogo.addEventListener('click', goHome);

    const sidebarToggle = $('sidebarToggle');
    if (sidebarToggle) sidebarToggle.addEventListener('click', (event) => {
        event.stopPropagation();
        if (document.body.classList.contains('sidebar-open')) closeSidebar(); else openSidebar();
    });
    const sidebarOverlay = $('sidebarOverlay');
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

    const installAppButton = $('installAppButton');
    if (installAppButton) {
        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredInstallPrompt = event;
            installAppButton.classList.add('visible');
        });
        installAppButton.addEventListener('click', async () => {
            if (!deferredInstallPrompt) {
                const isInstalled = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
                alert(isInstalled
                    ? 'التطبيق مثبت بالفعل.'
                    : 'افتح قائمة المتصفح واختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".');
                return;
            }
            const installPrompt = deferredInstallPrompt;
            deferredInstallPrompt = null;
            try {
                await installPrompt.prompt();
                await installPrompt.userChoice;
            } finally {
                installAppButton.classList.remove('visible');
            }
        });
        window.addEventListener('appinstalled', () => installAppButton.classList.remove('visible'));
    }

    const searchToggle = $('searchToggle');
    if (searchToggle) searchToggle.addEventListener('click', openSearch);

    const searchClose = $('searchClose');
    if (searchClose) searchClose.addEventListener('click', closeSearch);

    const searchClear = $('searchClear');
    if (searchClear) searchClear.addEventListener('click', () => {
        const input = $('searchInput');
        if (!input) return;
        input.value = '';
        renderSearchResults('');
        input.focus();
    });

    const searchModal = $('searchModal');
    if (searchModal) searchModal.addEventListener('click', (e) => {
        if (e.target === searchModal) closeSearch();
    });

    const searchInput = $('searchInput');
    if (searchInput) {
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSearch();
        });
        searchInput.addEventListener('input', (e) => {
            renderSearchResults(e.target.value);
        });
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !$('searchModal')?.classList.contains('hidden')) closeSearch();
    });

    document.addEventListener('click', (e) => {
        if (!document.body.classList.contains('sidebar-open')) return;
        const sidebar = $('sidebar');
        const sidebarToggle = $('sidebarToggle');
        if (sidebar && sidebar.contains(e.target)) return;
        if (sidebarToggle && sidebarToggle.contains(e.target)) return;
        closeSidebar();
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=9', { updateViaCache: 'none' }).catch(err => console.warn('SW registration failed:', err));
    }

    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav) homeNav.addEventListener('click', goHome);
    if (matchesNav) {
        matchesNav.addEventListener('click', () => {
            openExternalPage(appSettings.matchesLink || DEFAULT_MATCHES_LINK);
        });
    }
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

function closeExternalLink() {
    window.currentViewMode = 'home';
    window.currentExternalUrl = '';
    if ($('externalLinkContainer')) $('externalLinkContainer').classList.add('hidden');
    if ($('grid')) $('grid').classList.remove('hidden');
    const homeNav = $('homeNav');
    const matchesNav = $('matchesNav');
    if (homeNav) homeNav.classList.add('active');
    if (matchesNav) matchesNav.classList.remove('active');
    if ($('externalLinkIframe')) $('externalLinkIframe').src = '';
    pushState();
}

function openMatchLink(url) {
    if (!url) return;
    openExternalPage(url);
}
    </script>
</body>
</html>
